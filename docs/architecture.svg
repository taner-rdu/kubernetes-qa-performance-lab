<svg viewBox="0 0 1180 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Locust on EC2 sends HTTP load to an ALB, which routes to a pod on an EKS node. Rising CPU triggers HPA and then Cluster Autoscaler to add up to two more nodes. Prometheus and Grafana scrape metrics from the pod. Pulumi provisions the whole cluster.">
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    .label { font-size: 11px; fill: #5b6673; }
    .label-strong { font-size: 12px; font-weight: 600; fill: #1a2230; }
  </style>

  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b84a5" />
    </marker>
    <marker id="arrow-node" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5620a" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6673" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="460" fill="#f4f6f8" />

  <g stroke="#1a2230" fill="none">

    <!-- Locust EC2 box -->
    <rect x="30" y="150" width="170" height="130" rx="8" stroke="#1a2230" stroke-width="1.5" />
    <text x="115" y="200" text-anchor="middle" class="label-strong">Locust</text>
    <text x="115" y="218" text-anchor="middle" class="label">EC2 · single node</text>
    <text x="115" y="234" text-anchor="middle" class="label">generates load</text>

    <!-- Locust -> ALB -->
    <line x1="200" y1="215" x2="255" y2="215" stroke="#0b84a5" stroke-width="2" marker-end="url(#arrow-flow)" />
    <text x="227" y="203" text-anchor="middle" class="label" fill="#0b84a5">load</text>

    <!-- ALB -->
    <rect x="260" y="180" width="110" height="70" rx="6" stroke="#1a2230" stroke-width="1.5" />
    <text x="315" y="210" text-anchor="middle" class="label-strong">ALB</text>
    <text x="315" y="226" text-anchor="middle" class="label" font-size="10">LoadBalancer</text>

    <!-- EKS outer box -->
    <rect x="420" y="40" width="730" height="360" rx="10" stroke="#ccd3da" stroke-width="1.5" />
    <text x="438" y="66" class="label" fill="#5b6673" letter-spacing="0.04em">EKS CLUSTER</text>
    <text x="1140" y="66" text-anchor="end" class="label" fill="#5b6673" font-size="10">provisioned by Pulumi</text>

    <!-- ALB -> Node1 -->
    <line x1="370" y1="215" x2="455" y2="215" stroke="#0b84a5" stroke-width="2" marker-end="url(#arrow-flow)" />
    <text x="412" y="203" text-anchor="middle" class="label" fill="#0b84a5">routes</text>

    <!-- Node 1 (solid, active) -->
    <rect x="460" y="110" width="190" height="230" rx="8" stroke="#1a2230" stroke-width="1.5" />
    <text x="555" y="138" text-anchor="middle" class="label-strong">Node 1</text>
    <text x="555" y="154" text-anchor="middle" class="label" fill="#1f8a4c">active · t3.small</text>
    <rect x="490" y="190" width="130" height="70" rx="6" stroke="#0b84a5" stroke-width="1.5" />
    <text x="555" y="220" text-anchor="middle" class="label-strong" font-size="11">pod</text>
    <text x="555" y="236" text-anchor="middle" class="label" font-size="9.5">cpu-burning-api</text>

    <!-- Node1 -> autoscale group -->
    <line x1="650" y1="225" x2="705" y2="225" stroke="#b5620a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-node)" />
    <text x="678" y="145" text-anchor="middle" class="label" fill="#b5620a" font-weight="700">① HPA</text>
    <text x="678" y="160" text-anchor="middle" class="label" fill="#b5620a" font-size="10">cpu% high</text>
    <text x="678" y="174" text-anchor="middle" class="label" fill="#b5620a" font-size="10">→ +pod</text>

    <!-- Autoscale ghost group -->
    <rect x="710" y="110" width="380" height="230" rx="8" stroke="#b5620a" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="900" y="138" text-anchor="middle" class="label-strong" fill="#b5620a">+ up to 2 more nodes</text>
    <text x="900" y="154" text-anchor="middle" class="label" fill="#b5620a">on demand</text>

    <rect x="740" y="190" width="130" height="70" rx="6" stroke="#b5620a" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="805" y="220" text-anchor="middle" class="label-strong" font-size="11" fill="#b5620a">pod</text>
    <text x="805" y="236" text-anchor="middle" class="label" font-size="9.5">cpu-burning-api</text>

    <rect x="900" y="190" width="130" height="70" rx="6" stroke="#b5620a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65" />
    <text x="965" y="220" text-anchor="middle" class="label-strong" font-size="11" fill="#b5620a" opacity="0.85">pod</text>
    <text x="965" y="236" text-anchor="middle" class="label" font-size="9.5" opacity="0.85">cpu-burning-api</text>

    <text x="900" y="300" text-anchor="middle" class="label" fill="#b5620a" font-weight="700">② Cluster Autoscaler</text>
    <text x="900" y="315" text-anchor="middle" class="label" fill="#b5620a" font-size="10">no room on Node 1 → new EC2 node · capped at max_size: 3</text>

    <!-- Observability -->
    <line x1="555" y1="260" x2="555" y2="378" stroke="#5b6673" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow-dim)" />
    <text x="575" y="325" class="label" font-size="10">scrapes</text>
    <rect x="440" y="382" width="230" height="60" rx="8" stroke="#1a2230" stroke-width="1.5" />
    <text x="555" y="406" text-anchor="middle" class="label-strong">Prometheus + Grafana</text>
    <text x="555" y="421" text-anchor="middle" class="label" font-size="10">dashboards + Locust report</text>

  </g>
</svg>
